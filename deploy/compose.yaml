# 万级智能体模拟问卷平台 —— Docker Compose（首版）
#
# 服务：web（nginx 托管前端 + 反代 /api）/ api（FastAPI）/ worker（独立进程）/ postgres。
# api 与 worker **复用同一镜像**，仅启动命令不同（architecture.md D1/C2）；长任务只在 worker 进程跑。
# DB 数据用命名卷持久化。
#
# 默认 = **mock 模式**（env_file: mock.env，不发起任何真实付费调用）。
# 切换真实 provider：
#   docker compose -f deploy/compose.yaml -f deploy/compose.real.yaml up -d --build
#   （先把 deploy/real.env.example 复制为 deploy/real.env 并填入 endpoint/model/key 环境变量名）
#
# 若无网关，仅在本机/受控内网使用；固定管理密钥不进前端静态代码（PRD §9 Q3）。

name: survey-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: survey
    # 裁决 N7-c：**不**映射到宿主 55432（本机容器 survey-pg 已独占该端口；也避免
    # compose 起的第二个实例与它冲突）。Compose 网络内其它服务用服务名访问
    # （postgres:5432）。如需在宿主用工具连库，用
    # `docker compose -f deploy/compose.yaml exec postgres psql -U postgres -d survey`。
    # 若确需宿主端口，请显式改为一个**确实空闲**的端口并同步 docs/runbook.md。
    volumes:
      - survey_pgdata:/var/lib/postgresql/data
      # 首启时创建测试库 survey_test（与开发库分离）。
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d survey"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - mock.env
    environment:
      # 容器内网络：服务名 postgres / 5432（postgres 服务**不再**映射宿主端口，见上）。
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/survey
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/survey_test
    # 启动前先迁移到 head，再起 HTTP 服务。
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - mock.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/survey
    # worker 是独立进程；不承载 HTTP。
    command: ["python", "-m", "app.worker.main"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  survey_pgdata:
