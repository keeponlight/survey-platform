# Alembic 配置（万级智能体模拟问卷平台）
# 说明：sqlalchemy.url 故意留空 —— migrations/env.py 优先读取本项，
# 为空时回退到 app.config.get_settings().database_url（默认开发库 survey）。
# 测试在 conftest.py 中以编程方式 set_main_option("sqlalchemy.url", <test DSN>) 覆盖。

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
